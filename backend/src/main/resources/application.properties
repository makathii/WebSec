spring.application.name=websec

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

app.jwt-secret=${JWT_SECRET}
app.password-pepper=${PASSWORD_PEPPER}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}
app.upload-dir=${UPLOAD_DIR:uploads}
app.turnstile-site-key=${TURNSTILE_SITE_KEY}
app.turnstile-secret-key=${TURNSTILE_SECRET_KEY}
