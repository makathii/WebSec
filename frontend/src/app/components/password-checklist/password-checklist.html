<div class="password-checklist">
  <div class="strength">
    <div class="strength-bar strength-{{ strength() }}"></div>
  </div>
  @if (label()) {
    <p class="strength-label strength-text-{{ strength() }}">{{ label() }}</p>
  }
  <ul>
    @for (rule of rules(); track rule.text) {
      <li [class.ok]="rule.ok">{{ rule.ok ? '✓' : '✗' }} {{ rule.text }}</li>
    }
    <li class="hint">Common passwords like "Password123!" are not allowed</li>
  </ul>
</div>
