<div class="column narrow">
  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Log in</h1>
    @if (info()) {
      <p class="info">{{ info() }}</p>
    }
    <label>
      Email or username
      <input type="text" formControlName="login" autocomplete="username" maxlength="254" />
    </label>
    <label>
      Password
      <div class="password-input">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" maxlength="256" />
        <button type="button" class="link-button" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </label>
    @if (captchaSiteKey(); as siteKey) {
      <app-turnstile [siteKey]="siteKey" action="login" (token)="onCaptchaToken($event)" (failed)="onCaptchaFailed()" />
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" class="button" [disabled]="form.invalid || !canSubmit()">
      {{ sending() ? 'Logging in...' : 'Log in' }}
    </button>
    <p class="muted">No account yet? <a routerLink="/signup">Sign up</a></p>
  </form>
</div>
